<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1388d5" />
    <title>Offline · Eventify</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0b1220; color: #e2e8f0; }
        .card { background: #111a2e !important; border-color: #1e293b !important; }
        .muted { color: #94a3b8 !important; }
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 40px 32px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 18px;
        display: block;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 20px; line-height: 1.5; }
      .muted { color: #64748b; font-size: 14px; }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #1388d5;
        border: 0;
        border-radius: 10px;
        padding: 10px 20px;
        cursor: pointer;
      }
      button:hover { background: #0f6fae; }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/icons/icon-192.png" alt="Eventify" />
      <h1>You're offline</h1>
      <p class="muted">
        Eventify can't reach the network right now. Any scores you entered
        are saved on this device and will sync automatically once you're back
        online.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
